<div class="password-field">
  <input
    [type]="inputType()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.autocomplete]="autocomplete()"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />

  <button
    type="button"
    class="toggle"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="visible()"
    [disabled]="disabled()"
    (mousedown)="$event.preventDefault()"
    (click)="toggleVisibility($event)"
  >
    @if (visible()) {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3l18 18M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.5-4.4M9.9 5.2A10.8 10.8 0 0 1 12 5c7 0 10 7 10 7a18.4 18.4 0 0 1-3.2 3.8M6.1 6.1C4 7.7 2.5 10 2 12s3 7 10 7a10.5 10.5 0 0 0 4.2-.8"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"
        />
        <circle
          cx="12"
          cy="12"
          r="3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
        />
      </svg>
    }
  </button>
</div>
